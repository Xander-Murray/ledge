name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledge_test
          POSTGRES_USER: ledge
          POSTGRES_PASSWORD: ledge_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledge -d ledge_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      LEDGE_TEST_DATABASE_URL: postgresql+psycopg://ledge:ledge_local@localhost:5432/ledge_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=src --cov-report=term-missing
