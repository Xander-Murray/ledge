services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ledge
      POSTGRES_USER: ledge
      POSTGRES_PASSWORD: ledge_local
    ports:
      - "5432:5432"
    volumes:
      - ledge_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  ledge_postgres_data:
