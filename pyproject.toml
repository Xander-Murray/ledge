[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ledge"
version = "0.1.0"
description = "A learning project for a trustworthy transaction ledger"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
dev = [
    "alembic>=1.14,<2",
    "httpx2>=2.12,<3",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requires the disposable PostgreSQL test database",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
